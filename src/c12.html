<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
.c{position:relative;width:704px;height:1280px;overflow:hidden;background:#040507}
svg{position:absolute;left:0;top:0}
</style></head><body>
<div class="c">
<svg width="704" height="1280" viewBox="0 0 704 1280">
  <defs>
    <linearGradient id="room2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e13"/>
      <stop offset=".6" stop-color="#05070a"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <linearGradient id="fig2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2430"/>
      <stop offset=".35" stop-color="#0c1015"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="rim2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9dc0e4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#040507" stop-opacity="0"/>
    </radialGradient>
    <filter id="b12b"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b44"><feGaussianBlur stdDeviation="44"/></filter>
    <filter id="b80b"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>

  <rect width="704" height="1280" fill="url(#room2)"/>

  <!-- 右侧冷光 -->
  <ellipse cx="600" cy="420" rx="300" ry="420" fill="url(#rim2)" filter="url(#b80b)"/>
  <rect x="540" y="0" width="164" height="1280" fill="#9dc0e4" opacity=".06" filter="url(#b44)"/>

  <!-- 人物上半身（更近的景别，肩膀因紧张而耸起） -->
  <g fill="url(#fig2)">
    <!-- 头（微侧，面朝右） -->
    <ellipse cx="330" cy="430" rx="104" ry="118" transform="rotate(-6 330 430)"/>
    <!-- 颈 -->
    <path d="M282 520 L392 512 L406 604 L276 614 Z"/>
    <!-- 耸起的肩线 -->
    <path d="M120 1280 L120 742 Q140 636 236 596 Q318 562 402 602 Q506 652 540 780 L556 1280 Z"/>
    <!-- 椅背 -->
    <path d="M60 1280 L60 860 Q64 812 108 806 L150 806 L150 1280 Z" fill="#070a0e"/>
  </g>

  <!-- 逆光轮廓（右缘） -->
  <g fill="none" stroke="#a8ccef" opacity=".55">
    <path d="M420 380 Q434 440 418 500" stroke-width="3.2"/>
    <path d="M424 606 Q500 664 528 762" stroke-width="3.6"/>
  </g>

  <g id="dust"></g>
</svg>
</div>
<script>
(function(){
  const r=(s)=>()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  let h='';const R=r(89);
  for(let i=0;i<20;i++){
    h+=`<circle cx="${(30+R()*640).toFixed(0)}" cy="${(120+R()*800).toFixed(0)}"
        r="${(0.7+R()*1.5).toFixed(1)}" fill="#a8c8e8" opacity="${(0.04+R()*0.12).toFixed(2)}"/>`;
  }
  document.getElementById('dust').innerHTML=h;
})();
</script></body></html>
