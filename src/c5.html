<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
.c{position:relative;width:704px;height:1280px;overflow:hidden;background:#050608}
svg{position:absolute;left:0;top:0}
</style></head><body>
<div class="c">
<svg width="704" height="1280" viewBox="0 0 704 1280">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa6cc"/>
      <stop offset=".5" stop-color="#4a6b8e"/>
      <stop offset="1" stop-color="#1d2c3d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fa6cc" stop-opacity=".35"/>
      <stop offset="1" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset=".72" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#1a2430"/>
    </linearGradient>
    <filter id="b8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b22"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="b46"><feGaussianBlur stdDeviation="46"/></filter>
  </defs>

  <rect width="704" height="1280" fill="#050608"/>

  <!-- 背后窗户的冷光 -->
  <rect x="368" y="96" width="300" height="700" rx="6" fill="url(#win)" opacity=".55"/>
  <rect x="368" y="96" width="300" height="700" rx="6" fill="none" stroke="#0a0e13" stroke-width="14"/>
  <line x1="518" y1="96" x2="518" y2="796" stroke="#0a0e13" stroke-width="12"/>
  <line x1="368" y1="446" x2="668" y2="446" stroke="#0a0e13" stroke-width="12"/>
  <ellipse cx="470" cy="470" rx="360" ry="420" fill="url(#halo)" filter="url(#b46)"/>

  <!-- 人物侧影：头 / 颈 / 肩胸（面朝右，逆光） -->
  <g fill="url(#body)">
    <!-- 头 -->
    <ellipse cx="300" cy="430" rx="82" ry="96"/>
    <!-- 后脑到颈 -->
    <path d="M232 500 Q228 566 258 592 L342 592 Q364 556 372 500 Z"/>
    <!-- 肩与上胸 -->
    <path d="M150 1280 L150 760 Q170 660 262 614 Q330 586 388 620 Q470 668 500 780 L512 1280 Z"/>
  </g>

  <!-- 衬衫：明确"穿着衣服"（衣身 + V 领），杜绝裸体误读 -->
  <path d="M258 610 Q330 584 392 622 L408 790 Q336 740 258 766 Z" fill="#0b1015"/>
  <g fill="none" stroke="#9dc0e4" stroke-width="3.4" opacity=".55">
    <path d="M264 598 L302 690"/>
    <path d="M346 598 L308 690"/>
  </g>
  <line x1="262" y1="614" x2="392" y2="622" stroke="#9dc0e4" stroke-width="2" opacity=".3"/>

  <!-- 逆光轮廓（右缘） -->
  <g fill="none" stroke="#9dc0e4" opacity=".55">
    <path d="M382 430 Q382 486 366 512" stroke-width="3"/>
    <path d="M400 620 Q470 672 498 782" stroke-width="3.4"/>
  </g>

  <!-- 台面 -->
  <rect x="0" y="1150" width="704" height="130" fill="#030405"/>

  <!-- 空气微尘 -->
  <g id="dust"></g>
</svg>
</div>
<script>
(function(){
  const r=(s)=>()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  let h='';const R=r(61);
  for(let i=0;i<26;i++){
    h+=`<circle cx="${(30+R()*640).toFixed(0)}" cy="${(120+R()*880).toFixed(0)}"
        r="${(0.7+R()*1.7).toFixed(1)}" fill="#a8c8e8" opacity="${(0.05+R()*0.14).toFixed(2)}"/>`;
  }
  document.getElementById('dust').innerHTML=h;
})();
</script></body></html>
