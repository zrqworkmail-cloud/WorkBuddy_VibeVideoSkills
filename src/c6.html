<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
.c{position:relative;width:704px;height:1280px;overflow:hidden;background:#040507}
svg{position:absolute;left:0;top:0}
</style></head><body>
<div class="c">
<svg width="704" height="1280" viewBox="0 0 704 1280">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="1" stop-color="#040507"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0e"/>
      <stop offset=".65" stop-color="#0d1116"/>
      <stop offset="1" stop-color="#1b2531"/>
    </linearGradient>
    <radialGradient id="scr" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset=".55" stop-color="#9dc6f5"/>
      <stop offset="1" stop-color="#4b7fc4"/>
    </radialGradient>
    <radialGradient id="spill" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bcd8ff" stop-opacity=".50"/>
      <stop offset=".5" stop-color="#5b8fd0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#040507" stop-opacity="0"/>
    </radialGradient>
    <filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b34"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="b70"><feGaussianBlur stdDeviation="70"/></filter>
  </defs>

  <rect width="704" height="1280" fill="url(#wall)"/>

  <!-- 手机位置的环境光（右侧） -->
  <ellipse cx="516" cy="812" rx="300" ry="320" fill="url(#spill)" filter="url(#b70)"/>

  <!-- 人物背影：头 / 肩背（前景，大而暗） -->
  <g fill="url(#back)">
    <ellipse cx="288" cy="470" rx="96" ry="112"/>
    <path d="M170 1280 L170 800 Q186 690 268 646 Q360 600 452 664 Q540 726 556 840 L566 1280 Z"/>
  </g>

  <!-- 手机：右下，屏幕朝人，光溢到肩背边缘 -->
  <g>
    <rect x="470" y="700" width="118" height="212" rx="16" fill="#0a0d12" stroke="#2a3a4e" stroke-width="3"/>
    <rect x="480" y="712" width="98" height="188" rx="10" fill="url(#scr)"/>
    <!-- 屏幕内容剪影 -->
    <g fill="#2b4d78" opacity=".35">
      <rect x="492" y="730" width="60" height="8" rx="3"/>
      <rect x="492" y="752" width="74" height="7" rx="3"/>
      <rect x="492" y="772" width="48" height="7" rx="3"/>
      <rect x="492" y="806" width="74" height="52" rx="7"/>
    </g>
    <ellipse cx="529" cy="806" rx="86" ry="130" fill="#9dc6f5" opacity=".22" filter="url(#b34)"/>
  </g>

  <!-- 屏幕光在肩背上的边缘高光 -->
  <g fill="none" stroke="#a8ccf0" opacity=".42">
    <path d="M540 760 Q560 812 562 880" stroke-width="3.6"/>
    <path d="M516 690 Q548 706 560 736" stroke-width="2.4"/>
  </g>

  <!-- 空气微尘 -->
  <g id="dust"></g>
</svg>
</div>
<script>
(function(){
  const r=(s)=>()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  let h='';const R=r(73);
  for(let i=0;i<24;i++){
    h+=`<circle cx="${(40+R()*620).toFixed(0)}" cy="${(160+R()*840).toFixed(0)}"
        r="${(0.7+R()*1.6).toFixed(1)}" fill="#a8c8e8" opacity="${(0.05+R()*0.13).toFixed(2)}"/>`;
  }
  document.getElementById('dust').innerHTML=h;
})();
</script></body></html>
